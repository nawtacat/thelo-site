<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thelo</title>
    <link rel="icon" href="/img/thelofavicon.png" type="image/png">
    <!-- Sign-up and sign-in live in the student app (/sdashboard), exactly as in the phone
         app. This page used to have its own form with a tutor option; old links land here. -->
    <meta http-equiv="refresh" content="0; url=/sdashboard/">
    <script>
        (function () {
            var lang = null;
            try { lang = localStorage.getItem('thelo-lang'); } catch (e) { /* private mode */ }
            var q = new URLSearchParams(location.search);
            if (!q.get('lang') && ['en', 'hy', 'ru'].indexOf(lang) >= 0) q.set('lang', lang);
            var s = q.toString();
            location.replace('/sdashboard/' + (s ? '?' + s : ''));
        })();
    </script>
</head>
<body>
    <p><a href="/sdashboard/">thelo</a></p>
</body>
</html>
