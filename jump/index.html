    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        /*
         * Jump tests. A section test unlocks a later section of the student's course; a
         * grade test lets them move up to a higher grade. Opened from home.html:
         *
         *   /jump/?kind=section&lang=hy&course=grade9-hy-math&folder=NINE-HY&from=12&to=30&unit=3&title=...
         *   /jump/?kind=grade&lang=hy&from=7&curstream=&complete=0&target=9&stream=
         *
         *   /jump/?kind=checkpoint&lang=hy&course=grade7-hy-math&folder=SEVEN-HY&unit=1&pos=mid&title=...
         *   ...&revise=1   opens the Revise screen of the last failed try
         *
         * The `assess` Cloud Function picks the questions from lessons/<FOLDER>/tests.json,
         * checks every answer (handwritten ones with the AI checker) and writes the result;
         * this page never sees an answer before it is given. 80% passes. Starting a test
         * counts as a try: leaving or failing locks that test for 24 hours
         * (thelo-students/{uid}.jumpTests, .checkpoints for checkpoints). A failed
         * checkpoint offers Revise: each mistake with the right answer and the worked
         * solution, then practice problems from the same lessons (checked here, not saved).
         */
        :root {
            --thelo-blue: #2563EB;
            --thelo-blue-dark: #1d4ed8;
            --thelo-bg: #F8F9FA;
            --thelo-text: #111827;
            --grid-color: #E5E7EB;
            --slate-200: #e2e8f0;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
            --white: #ffffff;
            --green: #16A34A;
            --green-bg: #DCFCE7;
            --red: #DC2626;
            --red-bg: #FEE2E2;
        }
        @font-face { font-family: 'Montserrat Arm'; src: url('/fonts/Montserratarm-Regular.otf'); font-weight: 400; }
        @font-face { font-family: 'Montserrat Arm'; src: url('/fonts/Montserratarm-SemiBold.otf'); font-weight: 600; }
        @font-face { font-family: 'Montserrat Arm'; src: url('/fonts/Montserratarm-ExtraBold.otf'); font-weight: 800; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            font-family: 'Manrope', sans-serif; background: var(--thelo-bg); color: var(--thelo-text);
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
            overflow-wrap: anywhere;   /* long Armenian words break instead of leaving their card */
            background-image:
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        body.lang-hy { font-family: 'Montserrat Arm', 'Manrope', sans-serif; }
        .wrap { width: 100%; max-width: 560px; margin: 0 auto; }

        header.jt-top {
            display: flex; align-items: center; gap: 0.9rem;
            padding: calc(env(safe-area-inset-top) + 1rem) 1.25rem 0.75rem;
        }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--grid-color);
            background: var(--white); color: var(--slate-500); font-size: 1.1rem; cursor: pointer; flex-shrink: 0;
        }
        .jt-bar { flex: 1; height: 12px; background: var(--slate-200); border-radius: 999px; overflow: hidden; }
        .jt-fill { height: 100%; width: 0; background: var(--thelo-blue); border-radius: 999px; transition: width 0.3s ease; }
        .jt-count { font-weight: 800; font-size: 0.85rem; color: var(--slate-500); min-width: 3.2rem; text-align: right; }

        main#jt-main { flex: 1; overflow-y: auto; padding: 0.5rem 1.25rem 1rem; display: flex; flex-direction: column; }
        footer#jt-foot { padding: 0.75rem 1.25rem calc(env(safe-area-inset-bottom) + 1rem); }

        .card {
            background: var(--white); border: 1px solid var(--grid-color); border-radius: 1rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06); padding: 1.5rem;
        }
        .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--slate-500); font-weight: 700; }
        .label.brand { text-transform: none; font-size: 0.85rem; letter-spacing: 0; }   /* "thelo" is always lowercase */
        h1.title { font-size: 1.6rem; font-weight: 800; line-height: 1.25; margin: 0.4rem 0 0.9rem; }
        p.body { font-size: 1rem; line-height: 1.5; color: #374151; margin-bottom: 0.75rem; }
        .facts { list-style: none; margin: 1rem 0 0.25rem; display: grid; gap: 0.6rem; }
        .facts li { display: flex; gap: 0.7rem; align-items: center; font-weight: 600; font-size: 0.95rem; }
        .facts i { width: 1.2rem; text-align: center; color: var(--thelo-blue); }
        .note { font-size: 0.85rem; color: var(--slate-500); margin-top: 1rem; line-height: 1.45; }
        .center { flex: 1; display: flex; flex-direction: column; justify-content: center; }

        .btn {
            width: 100%; padding: 1rem; border-radius: 1rem; font-weight: 800; font-size: 1.05rem; font-family: inherit;
            border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 0.5rem;
            transition: 0.2s;
        }
        .btn-primary { background: var(--thelo-blue); color: var(--white); box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.3); }
        .btn-primary:disabled { background: var(--slate-200); color: var(--slate-400); box-shadow: none; cursor: default; }
        .btn-green { background: var(--green); color: var(--white); }
        .btn-red { background: var(--red); color: var(--white); }
        .btn-ghost { background: none; color: var(--slate-500); font-weight: 700; margin-top: 0.4rem; }

        .q-label { margin: 0.25rem 0 0.5rem; }
        .q-text { font-size: 1.2rem; font-weight: 700; line-height: 1.45; margin-bottom: 1.1rem; word-wrap: break-word; }
        .q-text .katex { font-size: 1.05em; }

        .choices { display: grid; gap: 0.7rem; }
        .choice {
            text-align: left; font: inherit; font-size: 1.05rem; font-weight: 600; padding: 1rem 1.1rem;
            background: var(--white); border: 2px solid var(--grid-color); border-radius: 0.9rem; cursor: pointer;
            box-shadow: 0 2px 0 var(--grid-color);
        }
        .choice.sel { border-color: var(--thelo-blue); background: #EFF6FF; box-shadow: 0 2px 0 var(--thelo-blue); }
        .choice.right { border-color: var(--green); background: var(--green-bg); box-shadow: none; }
        .choice.wrong { border-color: var(--red); background: var(--red-bg); box-shadow: none; }
        .choice:disabled { cursor: default; color: inherit; }

        .answer-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1rem; }
        .answer-box {
            flex: 1; min-height: 3.6rem; display: flex; align-items: center; padding: 0 1rem;
            background: var(--white); border: 2px solid var(--thelo-blue); border-radius: 0.9rem;
            font-size: 1.6rem; font-weight: 800; letter-spacing: 0.02em;
        }
        .answer-box.empty::after { content: '?'; color: var(--slate-400); }
        .answer-box.right { border-color: var(--green); background: var(--green-bg); }
        .answer-box.wrong { border-color: var(--red); background: var(--red-bg); }
        .unit { font-size: 1.3rem; font-weight: 700; color: var(--slate-500); }
        .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.55rem; }
        .key {
            font: inherit; font-size: 1.35rem; font-weight: 800; padding: 0.85rem 0; border-radius: 0.8rem;
            background: var(--white); border: 1px solid var(--grid-color); box-shadow: 0 2px 0 var(--grid-color); cursor: pointer;
        }
        .key.op { color: var(--thelo-blue); }
        .key:active { transform: translateY(1px); box-shadow: none; }
        .key:disabled { color: var(--slate-400); }

        .pad-wrap {
            flex: 1; min-height: 260px; position: relative; background: var(--white);
            border: 2px solid var(--grid-color); border-radius: 1rem; overflow: hidden;
        }
        .pad-wrap canvas { width: 100%; height: 100%; display: block; touch-action: none; }
        .pad-tools { position: absolute; top: 0.5rem; right: 0.5rem; display: flex; gap: 0.4rem; }
        .pad-hint { position: absolute; left: 0.9rem; bottom: 0.6rem; font-size: 0.8rem; color: var(--slate-400); pointer-events: none; }

        .feedback { border-radius: 1rem; padding: 1rem 1.1rem; margin-bottom: 0.75rem; font-weight: 700; line-height: 1.4; }
        .feedback.right { background: var(--green-bg); color: #14532D; }
        .feedback.wrong { background: var(--red-bg); color: #7F1D1D; }
        .feedback .fb-title { font-size: 1.1rem; font-weight: 800; display: flex; gap: 0.5rem; align-items: center; }
        .feedback .fb-body { font-weight: 600; margin-top: 0.3rem; font-size: 0.95rem; }

        .result-icon {
            width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 2.6rem; margin: 0 auto 1.2rem;
        }
        .result-icon.pass { background: var(--green-bg); color: var(--green); }
        .result-icon.fail { background: var(--red-bg); color: var(--red); }
        .score { font-size: 3rem; font-weight: 800; text-align: center; }
        .score small { font-size: 1.4rem; color: var(--slate-500); }
        .text-center { text-align: center; }

        .modal-back {
            position: fixed; inset: 0; background: rgba(17, 24, 39, 0.45); display: none;
            align-items: flex-end; justify-content: center; z-index: 50;
        }
        .modal-back.show { display: flex; }
        .modal { background: var(--white); width: 100%; max-width: 560px; border-radius: 1.25rem 1.25rem 0 0; padding: 1.5rem 1.25rem calc(env(safe-area-inset-bottom) + 1.25rem); }
        .modal h2 { font-size: 1.25rem; font-weight: 800; margin-bottom: 0.5rem; }

        .review-item { padding: 1.1rem; margin-bottom: 0.8rem; }
        .review-item .q-text { font-size: 1.05rem; margin-bottom: 0.7rem; }
        .rv-row { display: flex; gap: 0.6rem; align-items: baseline; flex-wrap: wrap; padding: 0.45rem 0.7rem; border-radius: 0.7rem; margin-bottom: 0.35rem; font-size: 0.95rem; }
        .rv-row span { font-weight: 700; color: var(--slate-500); font-size: 0.82rem; }
        .rv-row.wrong { background: var(--red-bg); } .rv-row.right { background: var(--green-bg); }
        .rv-note { font-size: 0.9rem; color: #374151; line-height: 1.45; margin: 0.4rem 0 0; }
        .rv-steps { margin-top: 0.6rem; font-size: 0.92rem; line-height: 1.5; }
        .rv-steps summary { font-weight: 800; color: var(--thelo-blue); cursor: pointer; }
        .rv-steps p { margin-top: 0.35rem; }
        .feedback .rv-steps { color: inherit; font-weight: 600; }
        .spinner { width: 42px; height: 42px; border: 4px solid var(--slate-200); border-top-color: var(--thelo-blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

</head>
<body data-thelo-page="jump">

        <button class="icon-btn" id="jt-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        <div class="jt-bar"><div class="jt-fill" id="jt-fill"></div></div>
        <span class="jt-count" id="jt-count"></span>

    <main id="jt-main" class="wrap"></main>
    <footer id="jt-foot" class="wrap"></footer>

    <div class="modal-back" id="jt-modal">
        <div class="modal">
            <h2 id="jt-modal-title"></h2>
            <p class="body" id="jt-modal-body"></p>
            <button class="btn btn-red" id="jt-modal-leave"></button>
            <button class="btn btn-ghost" id="jt-modal-stay"></button>
        </div>
    </div>

        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        /** Text with /K ... K/ KaTeX segments, as written by lesson-gen. */
        function renderRich(el, text) {
            el.textContent = '';
            const re = /\/K\s?([\s\S]*?)\s?K\//g;
            let last = 0, m;
            const src = String(text ?? '');
            while ((m = re.exec(src))) {
                if (m.index > last) el.appendChild(document.createTextNode(src.slice(last, m.index)));
                const span = document.createElement('span');
                try { katex.render(m[1], span, { throwOnError: false }); } catch (e) { span.textContent = m[1]; }
                el.appendChild(span);
                last = re.lastIndex;
            }
            if (last < src.length) el.appendChild(document.createTextNode(src.slice(last)));
        }

        function shuffle(a) {
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function parseNum(s) {
            const t = String(s ?? '').replace(/[\s ]/g, '').replace(/−/g, '-').replace(/,/g, '.');
            if (!/^-?(\d+\.?\d*|\.\d+)(\/-?(\d+\.?\d*|\.\d+))?$/.test(t)) return NaN;
            if (t.includes('/')) {
                const [a, b] = t.split('/').map(Number);
                return b === 0 ? NaN : a / b;
            }
            return Number(t);
        }
        const sameNumber = (a, b) => Number.isFinite(a) && Number.isFinite(b) && Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(b));

        }

        // ------------------------------------------------------------------ the test being asked for
        // The keys must match thelo-backend/functions/assess.js.
        const spec = (() => {

            }
            if (KIND === 'checkpoint') {

                return {

                    folders: [params.get('folder') || ''],
                    // lesson numbers covered (for the local demo; the server works them out itself)
                    from: Number(params.get('from')) || 1, to: Number(params.get('to')) || 999,
                    unit, pos, course, title: params.get('title') || '',
                    size: SIZES[pos],
                    server: { kind: 'checkpoint', course, unit, pos },
                };
            }
            const target = Number(params.get('target'));
            const tstream = params.get('stream') || '';
            const cur = Number(params.get('from'));
            const curStream = params.get('curstream') || '';
            const start = params.get('complete') === '1' ? cur + 1 : cur;
            const grades = [];
            for (let g = start; g < target; g++) {
                if (!FOLDER_NAMES[g]) continue;
                grades.push({ grade: g, stream: g >= 10 ? (g === cur ? (curStream || tstream || 'gen') : (tstream || 'gen')) : '' });
            }
            return {
                key: `g_${LANG}_${target}${tstream}`, field: 'jumpTests',
                folders: grades.map(g => folderFor(g.grade, g.stream)),

        // ------------------------------------------------------------------ questions on this device
        // Used by the local demo and by practice (which is never scored). Real tests are
        // picked and checked by the server (assess), which never sends the answers here.
        async function loadPool(folder) {
            const base = DEMO && params.get('pools') ? params.get('pools') : `${ASSET_ORIGIN}/lessons`;
            const res = await fetch(`${base}/${encodeURIComponent(folder)}/tests.json`, { cache: 'no-cache' });
            if (!res.ok) throw new Error(`HTTP ${res.status} for ${folder}/tests.json`);
            return res.json();
        }
        const poolLessons = (pool) => (pool.units || []).flatMap(u => u.lessons || []);

        /** Questions spread evenly over the lessons (same as assess.js). */
        function pickQuestions(lessons, nQuick, nWritten) {
            const used = new Set();
            const pickFrom = (ls, n, key) => {
                const out = [];
                if (!ls.length) return out;
                for (let i = 0; i < n; i++) {
                    const lo = Math.floor(i * ls.length / n);
                    const hi = Math.max(lo + 1, Math.floor((i + 1) * ls.length / n));
                    for (let tries = 0; tries < 15; tries++) {
                        const span = tries < 8 ? hi - lo : ls.length;
                        const l = ls[(tries < 8 ? lo : 0) + Math.floor(Math.random() * span)];
                        const qi = Math.floor(Math.random() * l[key].length);
                        const tag = `${l.id}|${key}|${qi}`;
                        if (used.has(tag)) continue;
                        used.add(tag);
                        out.push({ q: l[key][qi], lessonId: l.id });
                        break;
                    }
                }
                return out;
            };
            const written = pickFrom(lessons.filter(l => l.written && l.written.length), nWritten, 'written');
            const quick = pickFrom(lessons.filter(l => l.quick && l.quick.length), nQuick + (nWritten - written.length), 'quick');
            const items = [];
            for (const { q, lessonId } of shuffle(quick)) {
                if (Array.isArray(q.c)) {
                    const order = shuffle(q.c.map((_, i) => i));
                    items.push({ pub: { type: 'mcq', q: q.q, c: order.map(i => q.c[i]) }, sec: { a: order.indexOf(q.a), s: q.s || '' }, lessonId });
                } else {
                    items.push({ pub: { type: 'num', q: q.q, u: q.u || '' }, sec: { n: String(q.n), u: q.u || '', s: q.s || '' }, lessonId });
                }
            }
            for (const { q, lessonId } of written) {
                items.push({ pub: { type: 'written', q: q.q }, sec: { a: q.a, s: q.s || '' }, lessonId });
            }
            return items;
        }
        const answerText = (item) => (item.pub.type === 'mcq' ? item.pub.c[item.sec.a]
            : item.pub.type === 'num' ? `${numText(item.sec.n)}${item.sec.u ? ' ' + item.sec.u : ''}` : item.sec.a);
        function checkLocally(item, payload) {
            if (item.pub.type === 'mcq') return payload.choice === item.sec.a;
            if (item.pub.type === 'num') return sameNumber(parseNum(payload.value), parseNum(item.sec.n));

        }

        // ------------------------------------------------------------------ backend

                return {
                    async start() { const r = await call('start', spec.server); attemptId = r.attemptId; return r; },
                    answer: (i, payload) => call('answer', Object.assign({ attemptId, index: i }, payload)),
                    finish: () => call('finish', { attemptId }),

            let items = [];

                async start() {

                async finish() {

        async function startTest() {

        function questionHeader(q, hint) {

        /** Sends one answer; a failed check is never the student's fault, so it can be retried. */

        // --- multiple choice
        function showMcq(q) {
            let picked = -1;
            screen(`${questionHeader(q, T.chooseOne)}
                    <div class="choices">${q.c.map((_, i) => `<button class="choice" data-i="${i}"></button>`).join('')}</div>`,

                const rightIndex = q.c.indexOf(r.answer);

        // --- a number on the keypad
        function showNum(q) {

            const dec = LANG === 'hy' ? ',' : '.';

            screen(`${questionHeader(q, T.typeAnswer)}
                    <div class="answer-row"><div class="answer-box empty" id="jt-box"></div>${q.u ? `<span class="unit">${esc(q.u)}</span>` : ''}</div>

            const box = document.getElementById('jt-box');
            const check = document.getElementById('jt-check');
            const draw = () => {
                box.textContent = typed;
                box.classList.toggle('empty', !typed);
                check.disabled = !typed;
            };
            $main.querySelectorAll('.key').forEach(b => {
                b.onclick = () => {
                    const k = b.dataset.k;

                check.textContent = T.checking;
                const r = await send({ value: typed });
                if (!r) return checkFailed(check);
                $main.querySelectorAll('.key').forEach(b => { b.disabled = true; });
                box.classList.add(r.correct ? 'right' : 'wrong');
                answered(r.correct, r.correct ? '' : fmt(T.answerWas, { a: r.answer }));
            };
        }

        // --- handwritten, checked by the AI on the server
        function showWritten(q) {

            renderRich(document.getElementById('jt-q'), q.q);

            document.getElementById('jt-clear').onclick = () => pad.clear();
            const check = document.getElementById('jt-check');
            const fb = document.getElementById('jt-fb');
            check.onclick = async () => {
                if (!pad.hasInk) {
                    fb.innerHTML = `<div class="feedback wrong"><div class="fb-body">${esc(T.noInk)}</div></div>`;
                    return;
                }
                fb.innerHTML = '';
                check.disabled = true;
                check.textContent = T.checking;
                const r = await send({ imageBase64: pad.exportImage() });
                if (!r) return checkFailed(check);
                document.querySelector('.pad-wrap').style.pointerEvents = 'none';
                answered(r.correct, r.correct ? '' : [r.feedback, fmt(T.answerWas, { a: r.answer })].filter(Boolean).join(' '));
            };
        }

        function answered(ok, detail) {
            if (ok) correct++;
            const last = idx === questions.length - 1;
            setProgress(idx + 1, questions.length);
            $count.textContent = `${idx + 1}/${questions.length}`;
            $foot.innerHTML = `
                <div class="feedback ${ok ? 'right' : 'wrong'}">
                    <div class="fb-title"><i class="fa-solid ${ok ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>${esc(ok ? T.right : T.wrong)}</div>
                    ${detail ? '<div class="fb-body" id="jt-fb-body"></div>' : ''}
                </div>
                <button class="btn ${ok ? 'btn-green' : 'btn-red'}" id="jt-next">${esc(last ? T.finish : T.continue)}</button>`;
            if (detail) renderRich(document.getElementById('jt-fb-body'), detail);
            document.getElementById('jt-next').onclick = () => {
                if (last) finish();
                else { idx++; showQuestion(); }
            };
        }

        // ------------------------------------------------------------------ the result
        async function finish() {
            running = false;
            setProgress(questions.length, questions.length);
            $count.textContent = '';
            showLoading(T.saving);
            let r;
            try {
                r = await backend.finish();
            } catch (e) {
                console.error('Saving the result failed', e);
                showMessage(T.saveFail, '', T.retrySave, finish);
                return;
            }
            showResult(r);
        }

        function showResult(r) {
            const body = r.passed
                ? (KIND === 'section' ? T.passSection : KIND === 'checkpoint' ? T.passCheckpoint : fmt(T.passGrade, { g: spec.target }))
                : fmt(KIND === 'checkpoint' ? T.failCheckpoint : T.failBody, { p: r.need });
            const canRevise = !r.passed && r.review && r.review.length;
            screen(`
                <div class="center text-center">
                    <div class="result-icon ${r.passed ? 'pass' : 'fail'}"><i class="fa-solid ${r.passed ? 'fa-trophy' : 'fa-rotate'}"></i></div>
                    <h1 class="title">${esc(r.passed ? T.passTitle : T.failTitle)}</h1>
                    <div class="score">${r.score}<small> / ${r.total}</small></div>
                    <p class="body" style="margin-top:1rem">${esc(body)}</p>
                </div>`,
                `${canRevise ? `<button class="btn btn-primary" id="jt-revise"><i class="fa-solid fa-book-open"></i> ${esc(T.revise)}</button>` : ''}
                 <button class="btn ${canRevise ? 'btn-ghost' : 'btn-primary'}" id="jt-done">${esc(T.toCourse)}</button>`);
            document.getElementById('jt-done').onclick = goHome;
            if (canRevise) document.getElementById('jt-revise').onclick = () => showReview(r, Date.now() + COOLDOWN_MS);
        }

        // ------------------------------------------------------------------ revise: mistakes, then practice
        function showReview(r, retryAt) {
            setProgress(0, 0);
            const items = r.review || [];
            screen(`
                <h1 class="title" style="margin-top:0.25rem">${esc(T.reviseTitle)}</h1>
                <p class="body">${esc(fmt(T.reviseSub, { h: remaining(Math.max(0, retryAt - Date.now())) }))}</p>
                ${items.map((it, i) => `
                    <div class="card review-item">
                        <div class="q-text" id="rv-q-${i}"></div>
                        <div class="rv-row wrong"><span>${esc(T.yourAnswer)}</span><b id="rv-your-${i}"></b></div>
                        <div class="rv-row right"><span>${esc(T.rightAnswer)}</span><b id="rv-ans-${i}"></b></div>
                        ${it.feedback ? `<p class="rv-note" id="rv-fb-${i}"></p>` : ''}
                        ${it.steps ? `<details class="rv-steps"><summary>${esc(T.howTo)}</summary><div id="rv-steps-${i}"></div></details>` : ''}
                    </div>`).join('')}`,
                `${r.practice && r.practice.lessonIds.length ? `<button class="btn btn-primary" id="jt-practise"><i class="fa-solid fa-dumbbell"></i> ${esc(T.practise)}</button>` : ''}
                 <button class="btn btn-ghost" id="jt-done">${esc(T.toCourse)}</button>`);
            items.forEach((it, i) => {
                renderRich(document.getElementById(`rv-q-${i}`), it.q);
                const your = it.your === null || it.your === undefined || it.your === ''
                    ? T.noAnswer
                    : it.type === 'mcq' ? (it.c && it.c[it.your]) || T.noAnswer
                    : it.type === 'num' ? numText(it.your) : `${it.your} (${T.handwrittenAnswer})`;
                renderRich(document.getElementById(`rv-your-${i}`), your);
                renderRich(document.getElementById(`rv-ans-${i}`), it.answer);
                if (it.feedback) document.getElementById(`rv-fb-${i}`).textContent = it.feedback;
                if (it.steps) {
                    const box = document.getElementById(`rv-steps-${i}`);
                    String(it.steps).split(/\s(?=\d+\.\s)/).forEach(s => { const p = document.createElement('p'); renderRich(p, s); box.appendChild(p); });
                }
            });
            document.getElementById('jt-done').onclick = goHome;
            const pr = document.getElementById('jt-practise');
            if (pr) pr.onclick = () => startPractice(r.practice, items);
        }

        async function startPractice(practice, reviewed) {
            showLoading(T.loading);
            let pool = [];
            try {
                for (const f of practice.folders) pool.push(...poolLessons(await loadPool(f)).filter(l => practice.lessonIds.includes(l.id)));
            } catch (e) {
                console.error('practice pool', e);
                showMessage(T.loadFail, '', T.back);
                return;
            }
            // Fresh problems from the same lessons, not the ones just reviewed.
            const seen = new Set(reviewed.map(r => r.q));
            const lessons = pool.map(l => Object.assign({}, l, { quick: (l.quick || []).filter(q => !seen.has(q.q)) }));
            const items = pickQuestions(lessons, PRACTICE_SIZE, 0).filter(it => !seen.has(it.pub.q));
            if (!items.length) { showMessage(T.practiceTitle, T.noPractice, T.toCourse); return; }
            let i = 0, right = 0;
            const next = () => {
                if (i >= items.length) {
                    showMessage(T.practiceTitle, fmt(T.practiceDone, { n: items.length, r: right }), T.toCourse, goHome,
                        { text: T.practiceAgain, onClick: () => startPractice(practice, reviewed.concat(items.map(it => ({ q: it.pub.q })))) });
                    return;
                }
                practiceQuestion(items[i], i, items.length, (ok) => { if (ok) right++; i++; next(); });
            };
            next();
        }

        /** One practice problem: checked right here, nothing is saved. */
        function practiceQuestion(item, i, n, done) {
            const q = item.pub;
            setProgress(i, n);
            const head = `<div class="q-label label">${esc(fmt(T.practiceOf, { i: i + 1, n }))}</div><div class="q-text" id="jt-q"></div>`;
            const after = (ok) => {
                $foot.innerHTML = `
                    <div class="feedback ${ok ? 'right' : 'wrong'}">
                        <div class="fb-title"><i class="fa-solid ${ok ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>${esc(ok ? T.right : T.wrong)}</div>
                        ${ok ? '' : '<div class="fb-body" id="jt-fb-body"></div>'}
                        ${item.sec.s ? `<details class="rv-steps"><summary>${esc(T.howTo)}</summary><div id="jt-steps"></div></details>` : ''}
                    </div>
                    <button class="btn ${ok ? 'btn-green' : 'btn-red'}" id="jt-next">${esc(T.continue)}</button>`;
                if (!ok) renderRich(document.getElementById('jt-fb-body'), fmt(T.answerWas, { a: answerText(item) }));
                if (item.sec.s) {
                    const box = document.getElementById('jt-steps');
                    String(item.sec.s).split(/\s(?=\d+\.\s)/).forEach(s => { const p = document.createElement('p'); renderRich(p, s); box.appendChild(p); });
                }
                document.getElementById('jt-next').onclick = () => done(ok);
            };
            if (q.type === 'mcq') {
                let picked = -1;
                screen(`${head}<div class="choices">${q.c.map((_, k) => `<button class="choice" data-i="${k}"></button>`).join('')}</div>`,
                    `<button class="btn btn-primary" id="jt-check" disabled>${esc(T.check)}</button>`);
                renderRich(document.getElementById('jt-q'), q.q);
                const buttons = [...$main.querySelectorAll('.choice')];
                buttons.forEach(b => {
                    renderRich(b, q.c[Number(b.dataset.i)]);
                    b.onclick = () => { picked = Number(b.dataset.i); buttons.forEach(x => x.classList.toggle('sel', x === b)); document.getElementById('jt-check').disabled = false; };
                });
                document.getElementById('jt-check').onclick = () => {
                    const ok = picked === item.sec.a;
                    buttons.forEach(b => { b.disabled = true; const k = Number(b.dataset.i); if (k === item.sec.a) b.classList.add('right'); else if (k === picked) b.classList.add('wrong'); b.classList.remove('sel'); });
                    after(ok);
                };
                return;
            }
            let typed = '';
            const dec = LANG === 'hy' ? ',' : '.';
            const keys = ['7', '8', '9', '⌫', '4', '5', '6', '−', '1', '2', '3', '/', '0', dec, '', ''];
            screen(`${head}<div class="answer-row"><div class="answer-box empty" id="jt-box"></div>${q.u ? `<span class="unit">${esc(q.u)}</span>` : ''}</div>
                    <div class="keypad">${keys.map(k => k ? `<button class="key${/[⌫−\/,.]/.test(k) ? ' op' : ''}" data-k="${esc(k)}">${esc(k)}</button>` : '<span></span>').join('')}</div>`,
                `<button class="btn btn-primary" id="jt-check" disabled>${esc(T.check)}</button>`);
            renderRich(document.getElementById('jt-q'), q.q);
            const box = document.getElementById('jt-box');
            const check = document.getElementById('jt-check');
            $main.querySelectorAll('.key').forEach(b => {
                b.onclick = () => {
                    const k = b.dataset.k;
                    if (k === '⌫') typed = typed.slice(0, -1);
                    else if (k === '−') typed = typed.startsWith('−') ? typed.slice(1) : '−' + typed;
                    else if (typed.length < 12) typed += k;
                    box.textContent = typed; box.classList.toggle('empty', !typed); check.disabled = !typed;
                };
            });
            check.onclick = () => {
                const ok = sameNumber(parseNum(typed), parseNum(item.sec.n));
                $main.querySelectorAll('.key').forEach(b => { b.disabled = true; });
                box.classList.add(ok ? 'right' : 'wrong');
                after(ok);
            };
        }

        // ------------------------------------------------------------------ waiting after a failed try
        function showWait(retryAt) {
            const h = remaining(Math.max(0, retryAt - Date.now()));
            const extra = KIND === 'checkpoint' && !DEMO
                ? { text: T.revise, onClick: openReview }
                : null;
            showMessage(T.waitTitle, fmt(T.waitBody, { h }), T.back, goHome, extra);
        }
        async function openReview() {
            showLoading(T.loading);
            try {
                const r = await backend.review();
                showReview(r, r.retryAt);
            } catch (e) {
                console.error('review', e);
                showMessage(T.loadFail, '', T.back);
            }
        }

        // ------------------------------------------------------------------ leaving mid-test
        const modal = document.getElementById('jt-modal');
        document.getElementById('jt-modal-title').textContent = T.leaveTitle;
        document.getElementById('jt-modal-body').textContent = T.leaveBody;
        document.getElementById('jt-modal-leave').textContent = T.leave;
        document.getElementById('jt-modal-stay').textContent = T.stay;
        document.getElementById('jt-modal-leave').onclick = goHome;
        document.getElementById('jt-modal-stay').onclick = () => modal.classList.remove('show');
        document.getElementById('jt-close').onclick = () => {
            if (running) modal.classList.add('show');
            else goHome();
        };

        // ------------------------------------------------------------------ start
        async function prepare() {
            showLoading(T.loading);
            if (!DEMO) {
                try {
                    const snap = await db.collection('thelo-students').doc(user.uid).get();
                    studentData = snap.exists ? snap.data() : {};
                } catch (e) {
                    console.warn('Could not read the student profile', e);
                }
                const rec = (studentData[spec.field] || {})[spec.key];
                if (REVISE) return openReview();
                if (rec && rec.passedAt && KIND === 'checkpoint') return showMessage(T.passedTitle, T.passedBody, T.toCourse);
                if (rec && rec.failedAt && Date.now() - rec.failedAt < COOLDOWN_MS) return showWait(rec.failedAt + COOLDOWN_MS);
            }
            showIntro();
        }

        if (DEMO) {
            prepare();
        } else if (!auth) {
            showMessage(T.loadFail, '', T.back);
        } else {
            showLoading(T.loading);
            const stop = auth.onAuthStateChanged(u => {
                stop();
                if (!u || u.isAnonymous) {
                    showMessage(T.signIn, '', T.back);
                    return;
                }
                user = u;
                prepare();
            });
        }
    })();
    </script>
<script src="/assets/thelo-web.js"></script>
</body>
